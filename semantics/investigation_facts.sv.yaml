      - name: RELATIONSHIP_TYPE
        expr: RELATIONSHIP_TYPE
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
      - name: SOURCE
        expr: SOURCE
        data_type: VARCHAR
      - name: DAYS_ON_LIST
        expr: DAYS_ON_LIST
        data_type: NUMBER
      - name: IS_CURRENT
        expr: IS_CURRENT
        data_type: BOOLEAN
    time_dimensions:
      - name: DATE_ADDED
        expr: DATE_ADDED
        data_type: DATE
    description: PEP list for cross-referencing during investigations. Each row represents one politically exposed person with tier and relationship details.
  - name: FCT_LOAN_PERFORMANCE
    base_table:
      database: RISK_DB
      schema: CURATED
      table: FCT_LOAN_PERFORMANCE
    dimensions:
      - name: PERFORMANCE_ID
        expr: PERFORMANCE_ID
        data_type: VARCHAR
      - name: DIM_LOAN_SK
        expr: DIM_LOAN_SK
        data_type: NUMBER
      - name: DIM_CUSTOMER_SK
        expr: DIM_CUSTOMER_SK
        data_type: NUMBER
      - name: DAYS_PAST_DUE
        expr: DAYS_PAST_DUE
        data_type: NUMBER
      - name: DELINQUENCY_STATUS
        expr: DELINQUENCY_STATUS
        data_type: VARCHAR
      - name: OUTSTANDING_PRINCIPAL
        expr: OUTSTANDING_PRINCIPAL
        data_type: NUMBER
      - name: PROVISION_AMOUNT
        expr: PROVISION_AMOUNT
        data_type: NUMBER
      - name: STAGE_IFRS9
        expr: STAGE_IFRS9
        data_type: VARCHAR
        description: 'IFRS9 impairment stage: Stage 1, Stage 2, or Stage 3.'
      - name: ECL_AMOUNT
        expr: ECL_AMOUNT
        data_type: NUMBER
      - name: IS_RESTRUCTURED
        expr: IS_RESTRUCTURED
        data_type: BOOLEAN
      - name: IS_WRITTEN_OFF
        expr: IS_WRITTEN_OFF
        data_type: BOOLEAN
      - name: RISK_MIGRATION
        expr: RISK_MIGRATION
        data_type: VARCHAR
      - name: IS_DELINQUENT
        expr: IS_DELINQUENT
        data_type: BOOLEAN
        description: True when the loan has missed one or more scheduled payments.
    time_dimensions:
      - name: REPORT_DATE
        expr: REPORT_DATE
        data_type: DATE
    description: Loan performance metrics for credit risk investigations. Each row represents one loan observation with delinquency, IFRS9 stage, and ECL data.
    metrics:
      - name: TOTAL_ECL
        description: Total expected credit loss.
        expr: SUM(ECL_AMOUNT)
      - name: TOTAL_OUTSTANDING
        description: Total outstanding loan principal.
        expr: SUM(OUTSTANDING_PRINCIPAL)
