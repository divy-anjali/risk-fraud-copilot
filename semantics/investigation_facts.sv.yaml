      - name: COUNTRY
        expr: COUNTRY
        data_type: VARCHAR
      - name: BALANCE
        expr: BALANCE
        data_type: NUMBER
      - name: CREDIT_LIMIT
        expr: CREDIT_LIMIT
        data_type: NUMBER
      - name: OVERDRAFT_LIMIT
        expr: OVERDRAFT_LIMIT
        data_type: NUMBER
      - name: RISK_SCORE
        expr: RISK_SCORE
        data_type: NUMBER
      - name: DAYS_SINCE_LAST_ACTIVITY
        expr: DAYS_SINCE_LAST_ACTIVITY
        data_type: NUMBER
      - name: IS_DORMANT
        expr: IS_DORMANT
        data_type: BOOLEAN
      - name: IS_OVERDRAWN
        expr: IS_OVERDRAWN
        data_type: BOOLEAN
      - name: IS_CURRENT
        expr: IS_CURRENT
        data_type: BOOLEAN
    time_dimensions:
      - name: OPENING_DATE
        expr: OPENING_DATE
        data_type: DATE
      - name: LAST_ACTIVITY_DATE
        expr: LAST_ACTIVITY_DATE
        data_type: DATE
    unique_keys:
      - columns:
          - ACCOUNT_ID
    description: Account dimension providing account context for investigations including balance, dormancy, and overdraft status. Each row represents one account.
  - name: DIM_SANCTIONS
    base_table:
      database: RISK_DB
      schema: CURATED
      table: DIM_SANCTIONS
    dimensions:
      - name: DIM_SANCTIONS_SK
        expr: DIM_SANCTIONS_SK
        data_type: NUMBER
      - name: WATCHLIST_ID
        expr: WATCHLIST_ID
        data_type: VARCHAR
      - name: ENTITY_NAME
        expr: ENTITY_NAME
        data_type: VARCHAR
        description: Name of the sanctioned entity as listed on the watchlist.
      - name: ENTITY_TYPE
        expr: ENTITY_TYPE
        data_type: VARCHAR
      - name: SOURCE_LIST
        expr: SOURCE_LIST
        data_type: VARCHAR
        description: 'Originating sanctions list: OFAC, EU, UN, or HMT.'
      - name: COUNTRY
        expr: COUNTRY
        data_type: VARCHAR
      - name: REASON
        expr: REASON
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
      - name: MATCH_SCORE_THRESHOLD
        expr: MATCH_SCORE_THRESHOLD
        data_type: NUMBER
      - name: DAYS_ON_LIST
        expr: DAYS_ON_LIST
