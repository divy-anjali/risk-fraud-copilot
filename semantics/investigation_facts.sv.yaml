    dimensions:
      - name: DIM_ACCOUNT_SK
        expr: DIM_ACCOUNT_SK
        data_type: NUMBER
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        data_type: VARCHAR
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: ACCOUNT_TYPE
        expr: ACCOUNT_TYPE
        data_type: VARCHAR
      - name: CURRENCY
        expr: CURRENCY
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
      - name: BRANCH_CODE
        expr: BRANCH_CODE
