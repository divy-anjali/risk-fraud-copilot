    description: Loan master data for investigation context including ratings, risk parameters, and Basel violation flags. Each row represents one loan facility.
relationships:
  - name: FCT_LOAN_PERFORMANCE_TO_DIM_CUSTOMER
    left_table: FCT_LOAN_PERFORMANCE
    right_table: DIM_CUSTOMER
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: DIM_CUSTOMER_SK
        right_column: DIM_CUSTOMER_SK
  - name: FCT_LOAN_PERFORMANCE_TO_DIM_LOAN
    left_table: FCT_LOAN_PERFORMANCE
    right_table: DIM_LOAN
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: DIM_LOAN_SK
        right_column: DIM_LOAN_SK
  - name: FCT_TRANSACTION_TO_DIM_ACCOUNT
    left_table: FCT_TRANSACTION
    right_table: DIM_ACCOUNT
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: DIM_ACCOUNT_SK
        right_column: DIM_ACCOUNT_SK
  - name: FCT_TRANSACTION_TO_DIM_CUSTOMER
    left_table: FCT_TRANSACTION
    right_table: DIM_CUSTOMER
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: DIM_CUSTOMER_SK
        right_column: DIM_CUSTOMER_SK
verified_queries:
  - name: 0;1
    question: Which customers have the highest total amounts in AML flagged transactions and what are their investigation profiles?
    sql: SELECT c.FULL_NAME, c.CUSTOMER_ID, c.RISK_RATING, c.KYC_STATUS, c.PEP_FLAG, c.SANCTIONS_MATCH_FLAG, COUNT(t.TRANSACTION_ID) AS flagged_txns, SUM(t.AMOUNT) AS flagged_amount FROM fct_transaction AS t JOIN dim_customer AS c ON t.DIM_CUSTOMER_SK = c.DIM_CUSTOMER_SK WHERE t.HAS_AML_FLAG = TRUE AND c.IS_CURRENT = TRUE GROUP BY c.FULL_NAME, c.CUSTOMER_ID, c.RISK_RATING, c.KYC_STATUS, c.PEP_FLAG, c.SANCTIONS_MATCH_FLAG ORDER BY flagged_amount DESC
    verified_at: 1787803925
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What are the detailed transaction investigation records for all flagged AML activity including customer and account information?
    sql: SELECT c.FULL_NAME, c.CUSTOMER_ID, a.ACCOUNT_ID, a.ACCOUNT_TYPE, t.TRANSACTION_DATE, t.TRANSACTION_TYPE, t.AMOUNT, t.DIRECTION, t.BENEFICIARY_COUNTRY, t.AML_ALERT_TYPE, t.SCREENING_STATUS FROM fct_transaction AS t JOIN dim_customer AS c ON t.DIM_CUSTOMER_SK = c.DIM_CUSTOMER_SK JOIN dim_account AS a ON t.DIM_ACCOUNT_SK = a.DIM_ACCOUNT_SK WHERE t.HAS_AML_FLAG = TRUE AND c.IS_CURRENT = TRUE AND a.IS_CURRENT = TRUE ORDER BY t.TRANSACTION_DATE DESC
    verified_at: 1787803925
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are the delinquent loan investigation facts with customer and loan details?
    sql: SELECT c.FULL_NAME, c.RISK_RATING, lp.DELINQUENCY_STATUS, lp.STAGE_IFRS9, l.LOAN_TYPE, l.INTERNAL_RATING, lp.OUTSTANDING_PRINCIPAL, lp.ECL_AMOUNT, lp.DAYS_PAST_DUE FROM fct_loan_performance AS lp JOIN dim_loan AS l ON lp.DIM_LOAN_SK = l.DIM_LOAN_SK JOIN dim_customer AS c ON lp.DIM_CUSTOMER_SK = c.DIM_CUSTOMER_SK WHERE lp.IS_DELINQUENT = TRUE AND c.IS_CURRENT = TRUE AND l.IS_CURRENT = TRUE
    verified_at: 1787803925
    verified_by: Semantic Model Generator
