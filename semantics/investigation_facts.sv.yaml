name: INVESTIGATION_FACTS
description: Provides comprehensive investigation facts combining transaction alerts, customer profiles, account details, sanctions/PEP screening, and loan performance data. Designed for compliance investigators and case management workflows.
tables:
  - name: FCT_TRANSACTION
    base_table:
      database: RISK_DB
      schema: CURATED
      table: FCT_TRANSACTION
    dimensions:
      - name: TRANSACTION_ID
        expr: TRANSACTION_ID
        data_type: VARCHAR
      - name: DIM_ACCOUNT_SK
        expr: DIM_ACCOUNT_SK
        data_type: NUMBER
      - name: DIM_CUSTOMER_SK
        expr: DIM_CUSTOMER_SK
        data_type: NUMBER
      - name: TRANSACTION_TYPE
        expr: TRANSACTION_TYPE
        data_type: VARCHAR
      - name: AMOUNT
        expr: AMOUNT
        data_type: NUMBER
      - name: CURRENCY
        expr: CURRENCY
        data_type: VARCHAR
      - name: DIRECTION
        expr: DIRECTION
        data_type: VARCHAR
      - name: CHANNEL
        expr: CHANNEL
        data_type: VARCHAR
      - name: ORIGINATOR_NAME
        expr: ORIGINATOR_NAME
        data_type: VARCHAR
      - name: ORIGINATOR_COUNTRY
        expr: ORIGINATOR_COUNTRY
        data_type: VARCHAR
      - name: BENEFICIARY_NAME
        expr: BENEFICIARY_NAME
        data_type: VARCHAR
      - name: BENEFICIARY_COUNTRY
        expr: BENEFICIARY_COUNTRY
        data_type: VARCHAR
      - name: BENEFICIARY_BANK
        expr: BENEFICIARY_BANK
        data_type: VARCHAR
      - name: PURPOSE_CODE
        expr: PURPOSE_CODE
        data_type: VARCHAR
      - name: HAS_AML_FLAG
        expr: HAS_AML_FLAG
        data_type: BOOLEAN
        description: Indicates whether this transaction triggered an AML alert during screening.
      - name: AML_ALERT_TYPE
        expr: AML_ALERT_TYPE
        data_type: VARCHAR
        description: 'Category of AML alert: structuring, unusual pattern, sanctions match, or high-risk jurisdiction.'
      - name: RISK_SCORE
        expr: RISK_SCORE
        data_type: NUMBER
      - name: SCREENING_STATUS
        expr: SCREENING_STATUS
        data_type: VARCHAR
        description: 'Current screening status: PENDING, CLEARED, or ESCALATED.'
      - name: IS_CASH
        expr: IS_CASH
        data_type: BOOLEAN
      - name: IS_CTR_FILED
        expr: IS_CTR_FILED
        data_type: BOOLEAN
      - name: IS_CROSS_BORDER
        expr: IS_CROSS_BORDER
        data_type: BOOLEAN
      - name: IS_LARGE_TRANSACTION
        expr: IS_LARGE_TRANSACTION
        data_type: BOOLEAN
      - name: TRANSACTION_DATE_SK
        expr: TRANSACTION_DATE_SK
        data_type: NUMBER
    time_dimensions:
      - name: TRANSACTION_DATE
        expr: TRANSACTION_DATE
        data_type: DATE
      - name: TRANSACTION_TIMESTAMP
        expr: TRANSACTION_TIMESTAMP
        data_type: TIMESTAMP_NTZ
    description: Transaction fact with AML alert details and screening outcomes. Each row represents one transaction with full originator/beneficiary details for investigation workflows.
    metrics:
      - name: TOTAL_AMOUNT
        description: Total transaction amount for flagged activity.
        expr: SUM(AMOUNT)
      - name: FLAGGED_COUNT
        description: Count of AML-flagged transactions.
        expr: SUM(CASE WHEN HAS_AML_FLAG THEN 1 ELSE 0 END)
      - name: TRANSACTION_COUNT
        description: Count of transactions.
        expr: COUNT(TRANSACTION_ID)
  - name: DIM_CUSTOMER
    base_table:
      database: RISK_DB
      schema: CURATED
      table: DIM_CUSTOMER
    primary_key:
      columns:
        - DIM_CUSTOMER_SK
    dimensions:
      - name: DIM_CUSTOMER_SK
        expr: DIM_CUSTOMER_SK
        data_type: NUMBER
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: FULL_NAME
        expr: FULL_NAME
        data_type: VARCHAR
      - name: NATIONALITY
        expr: NATIONALITY
        data_type: VARCHAR
      - name: COUNTRY_OF_RESIDENCE
        expr: COUNTRY_OF_RESIDENCE
        data_type: VARCHAR
      - name: CUSTOMER_TYPE
        expr: CUSTOMER_TYPE
        data_type: VARCHAR
      - name: INDUSTRY
        expr: INDUSTRY
        data_type: VARCHAR
      - name: RISK_RATING
        expr: RISK_RATING
        data_type: VARCHAR
        description: 'Customer risk classification: LOW, MEDIUM, HIGH, or VERY HIGH.'
      - name: KYC_STATUS
        expr: KYC_STATUS
        data_type: VARCHAR
        description: 'KYC verification status: VERIFIED, PENDING, EXPIRED, or REJECTED.'
      - name: PEP_FLAG
        expr: PEP_FLAG
        data_type: BOOLEAN
        description: True if customer is identified as a Politically Exposed Person.
      - name: SANCTIONS_MATCH_FLAG
        expr: SANCTIONS_MATCH_FLAG
        data_type: BOOLEAN
        description: True if the customer name matched an entry on a sanctions watchlist.
      - name: ANNUAL_INCOME
        expr: ANNUAL_INCOME
        data_type: NUMBER
      - name: SOURCE_OF_FUNDS
        expr: SOURCE_OF_FUNDS
        data_type: VARCHAR
      - name: ACCOUNT_PURPOSE
        expr: ACCOUNT_PURPOSE
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
      - name: IS_HIGH_RISK
        expr: IS_HIGH_RISK
        data_type: BOOLEAN
      - name: AGE_YEARS
        expr: AGE_YEARS
        data_type: NUMBER
      - name: DAYS_SINCE_ONBOARDING
        expr: DAYS_SINCE_ONBOARDING
        data_type: NUMBER
      - name: IS_CURRENT
        expr: IS_CURRENT
        data_type: BOOLEAN
    time_dimensions:
      - name: DATE_OF_BIRTH
        expr: DATE_OF_BIRTH
        data_type: DATE
      - name: KYC_LAST_REVIEWED
        expr: KYC_LAST_REVIEWED
        data_type: DATE
      - name: ONBOARDING_DATE
        expr: ONBOARDING_DATE
        data_type: DATE
    unique_keys:
      - columns:
          - CUSTOMER_ID
    description: Customer dimension with full investigation profile including KYC status, PEP/sanctions flags, income, and onboarding history. Each row represents one customer.
  - name: DIM_ACCOUNT
    base_table:
      database: RISK_DB
      schema: CURATED
      table: DIM_ACCOUNT
    primary_key:
